x-backend: &backend
  build: .
  env_file: .env
  environment: &backend-env
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    DATABASE_URL: postgresql+psycopg://claims:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/claims
    DATA_DIR: /app/data
  volumes:
    - app-data:/app/data
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [private]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: claims
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --loglevel warning
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
  worker:
    <<: *backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    stop_grace_period: 65m
    mem_limit: 1g
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  dispatcher:
    <<: *backend
    command: python scripts/dispatch_outbox.py
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  app-data:
  redis-data:
  postgres-data:
networks:
  private:
    driver: bridge
